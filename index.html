<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오박사의 포켓몬고 허브 — 주소가 새로 이사했어요</title>
<meta name="description" content="오박사의 포켓몬고 허브가 https://pogo-obaksa.github.io/ 로 이사했습니다.">
<meta name="robots" content="noindex, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="오박사의 포켓몬고 허브 — 새 주소로 이동합니다">
<meta property="og:url" content="https://pogo-obaksa.github.io/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://pogo-obaksa.github.io/">
<meta http-equiv="refresh" content="0; url=https://pogo-obaksa.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23f5f7ff' stroke='%230b1020' stroke-width='8'/%3E%3Cpath d='M6 50h88' stroke='%230b1020' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%230b1020'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%23f5f7ff'/%3E%3C/svg%3E">
<script>
  /* 쿼리스트링(?guide=…)과 해시(#guide/…)까지 살려서 새 루트 주소로 넘긴다 */
  (function () {
    var dest = 'https://pogo-obaksa.github.io/' + window.location.search + window.location.hash;
    try { window.location.replace(dest); } catch (e) { window.location.href = dest; }
  })();
  /* 버튼도 같은 목적지(쿼리·해시 유지)로 */
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('go');
    if (btn) btn.href = 'https://pogo-obaksa.github.io/' + window.location.search + window.location.hash;
  });
</script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #eaf2ff 0%, #f7fafc 55%, #eef7f4 100%);
    color: #0b1020; -webkit-text-size-adjust: 100%;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border: 1px solid #e3e9f2; border-radius: 20px;
    padding: 28px 24px; text-align: center; box-shadow: 0 12px 32px rgba(15, 40, 90, .08);
  }
  .ball {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid #0b1020; position: relative; overflow: hidden;
    background: linear-gradient(#f5f7ff 0 46%, #0b1020 46% 54%, #fdfdff 54% 100%);
  }
  .ball::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
    transform: translate(-50%, -50%); border-radius: 50%; background: #fff; border: 3px solid #0b1020;
  }
  h1 { margin: 0 0 8px; font-size: 19px; line-height: 1.4; letter-spacing: -.2px; }
  p { margin: 0 0 18px; font-size: 14px; line-height: 1.65; color: #47536b; word-break: keep-all; }
  .addr { display: block; margin: 0 0 20px; font-size: 13px; color: #1f5fd0; font-weight: 700; word-break: break-all; }
  .btn {
    display: inline-block; width: 100%; padding: 14px 18px; border-radius: 14px;
    background: #1f5fd0; color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
    box-shadow: 0 8px 18px rgba(31, 95, 208, .22);
  }
  .btn:active { transform: translateY(1px); }
  .note { margin: 14px 0 0; font-size: 12px; color: #7b869c; word-break: keep-all; }
</style>
</head>
<body>
  <main class="card">
    <div class="ball" aria-hidden="true"></div>
    <h1>주소가 새로 이사했어요</h1>
    <p>오박사의 포켓몬고 허브는 이제 <strong>새 루트 주소</strong>에서 열립니다.<br>잠시 후 자동으로 이동합니다.</p>
    <a class="addr" href="https://pogo-obaksa.github.io/">https://pogo-obaksa.github.io/</a>
    <a class="btn" href="https://pogo-obaksa.github.io/" id="go">오박사의 포켓몬고 허브로 이동하기 →</a>
    <p class="note">자동으로 넘어가지 않으면 위 버튼을 눌러 주세요.<br>예전에 공유된 가이드 링크도 같은 글로 연결됩니다.</p>
  </main>
</body>
</html>
